<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boka bord – Kafé Kardemumma</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Kafé Kardemumma</h1>
    <nav aria-label="Huvudmeny">
      <ul>
        <li><a href="index.html">Startsida</a></li>
        <li><a href="index.html#meny">Meny</a></li>
        <li><a href="kontakt.html" aria-current="page">Boka bord</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Boka bord</h2>
    <p>Fyll i formuläret så bekräftar vi din bokning inom ett dygn. Fält markerade med * är obligatoriska.</p>

    <form action="#" method="post">
      <div class="falt">
        <label for="namn">Namn *</label>
        <input type="text" id="namn" name="namn" autocomplete="name" required>
      </div>

      <div class="falt">
        <label for="epost">E-postadress *</label>
        <input type="email" id="epost" name="epost" autocomplete="email" required>
      </div>

      <div class="falt">
        <label for="telefon">Telefon (valfritt)</label>
        <input type="tel" id="telefon" name="telefon" autocomplete="tel">
      </div>

      <div class="falt">
        <label for="datum">Datum *</label>
        <input type="date" id="datum" name="datum" required>
      </div>

      <div class="falt">
        <label for="antal">Antal personer *</label>
        <select id="antal" name="antal" required>
          <option value="">Välj antal</option>
          <option value="1">1 person</option>
          <option value="2">2 personer</option>
          <option value="3">3 personer</option>
          <option value="4">4 personer</option>
          <option value="5plus">5 eller fler</option>
        </select>
      </div>

      <fieldset>
        <legend>Kostönskemål</legend>
        <div class="val"><input type="checkbox" id="veg" name="kost" value="vegetarisk"><label for="veg">Vegetarisk</label></div>
        <div class="val"><input type="checkbox" id="vegan" name="kost" value="vegansk"><label for="vegan">Vegansk</label></div>
        <div class="val"><input type="checkbox" id="gluten" name="kost" value="glutenfri"><label for="gluten">Glutenfri</label></div>
      </fieldset>

      <fieldset>
        <legend>Hur vill du få bekräftelsen? *</legend>
        <div class="val"><input type="radio" id="via-epost" name="svar" value="epost" required><label for="via-epost">E-post</label></div>
        <div class="val"><input type="radio" id="via-sms" name="svar" value="sms"><label for="via-sms">SMS</label></div>
      </fieldset>

      <div class="falt">
        <label for="onskemal">Övriga önskemål</label>
        <textarea id="onskemal" name="onskemal" rows="4"></textarea>
      </div>

      <div class="val">
        <input type="checkbox" id="samtycke" name="samtycke" required>
        <label for="samtycke">Jag godkänner att Kafé Kardemumma sparar mina uppgifter för bokningen. *</label>
      </div>

      <button type="submit" class="knapp">Skicka bokning</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Kafé Kardemumma</p>
    <address>
      Fiktivgatan 1, 111 11 Stockholm<br>
      <a href="mailto:hej@kardemumma.example">hej@kardemumma.example</a>
    </address>
  </footer>
</body>
</html>
